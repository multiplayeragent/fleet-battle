<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Battle</title>
<style>
  :root { --ink: #eaf6ff; --gold: #ffd166; --panel: #0d2236; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #061523; }
  body { color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #status { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 12px; }
  #statusText { font-weight: 800; font-size: 19px; text-shadow: 0 2px 6px #000c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { font-size: 13px; opacity: .8; margin-top: 2px; min-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #timer { width: 180px; height: 6px; margin: 5px auto 0; border-radius: 4px; background: #ffffff22; overflow: hidden; }
  #timer i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
  #placeBar { position: fixed; left: 0; right: 0; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 22px); display: flex; justify-content: center; gap: 12px; }
  button { min-height: 48px; border-radius: 14px; border: 0; font: 800 16px system-ui, sans-serif; cursor: pointer; }
  #placeBar button { min-width: 128px; padding: 0 18px; background: #ffffff1c; color: #fff; border: 1px solid #ffffff33; }
  #placeBar button.go, #againPill { background: var(--gold); color: #2a1d00; border: 0; }
  #againPill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 22px); min-width: 150px; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: #000b; font-weight: 700;
           pointer-events: none; transition: opacity .4s; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #net { position: fixed; bottom: max(4px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .7; pointer-events: none; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0009; z-index: 30; }
  #over[hidden], #placeBar[hidden], #againPill[hidden] { display: none; }
  .box { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: var(--panel);
         border: 1px solid #ffffff22; text-align: center; box-shadow: 0 20px 60px #0009; }
  .box h2 { margin: 0 0 4px; font-size: 28px; } .box p { margin: 0 0 12px; opacity: .8; }
  .box h3 { margin: 6px 0 4px; font-size: 13px; color: var(--gold); text-align: left; }
  .box ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 30px; } .box li span { float: right; }
  .box li.note { list-style: none; margin-left: -24px; opacity: .75; } /* a status line, not a numbered entry */
  .box button { width: 100%; margin-top: 8px; background: var(--gold); color: #2a1d00; }
  .box button.ghost { background: #ffffff1a; color: #fff; }
  .hide { display: none !important; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="sea"></canvas>
<div id="safe"></div>
<div id="status"><div id="statusText"></div><div id="sub"></div><div id="timer"><i></i></div></div>
<div id="placeBar" hidden><button id="shuffle">Shuffle</button><button id="ready" class="go">Ready</button></div>
<button id="againPill" hidden>Play again</button>
<div id="toast" style="opacity:0"></div>
<div id="net">Connecting…</div>
<div id="over" hidden><div class="box">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Most wins</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button id="again">Play again</button><button id="look" class="ghost">Look at the boards</button>
</div></div>
<script>
/* ═══ FLEET BATTLE · a Multiplayer Agent starter ══════════════════════════════════════════
 * Hide your fleet, then take turns firing at the other grid. A hit fires again; sink all five to win.
 * Turn-based, 2 players; anyone else watches; a bot takes the other seat when you're alone.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ grid size, the fleet, timers, the bot, the leaderboard
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED FLEETS . the Seal helper: fleets are encrypted so only their owner can read them
 *   SHIPS ......... a ship's squares, checking a fleet, placing one at random (or to fit known shots)
 *   BOT ........... where a bot fires: chase a hit, else the square the most ships could cover
 *   MATCH (HOST) .. seats, placing, firing, hits and sinks, bots, timers, and taking over as a
 *                   new host. Only the host writes the shared fields.
 *   MY FLEET ...... reading my sealed fleet, placing it, firing, re-sending it to a new host
 *   SCREEN ........ layout, the sea, ships, shots, shells, particles, sounds
 *   HUD & RESULTS . status line, buttons, the results card and the leaderboard
 *   INPUT / LOOP .. pointer and keys, heartbeat, color fix, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The match lives in shared fields only the HOST writes: `game` (one JSON field: id, v, ph
 *     "place"|"fire"|"over", host, seats, ready, placeAt, placeEnds, first, turn, t, turnAt,
 *     turnEnds, marks, sunk, shots, hits, last, winner, endsAt, reveal) and `fleet0`/`fleet1`
 *     (each human's ships, SEALED to that player's public key so only they can read them; the
 *     host answers every shot, so it can read them too).
 *   - marks[k] is seat k's grid as the enemy sees it: "." not fired at, "o" miss, "x" hit.
 *     sunk[k] lists seat k's sunk ships (a ship's squares are public once it sinks).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s).
 *     It keeps both fleets in its own memory and works out every shot.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `pk` (public key), `hb`.
 *   - Players send intents to the host: "fleet" {g, box} (my placed ships, sealed to the host),
 *     "fire" {g, t, c}, "again" {g}. `t` counts every shot, so an old or double intent is ignored.
 *   - When the host changes, every seated player re-sends its fleet sealed to the new host
 *     ("myfleet" {to, r, box}). A bot's fleet can't be re-sent, so the new host places it again
 *     to fit every shot already fired (the same hits, misses and sunk ships).
 *   - Timers are timestamps: placeEnds, turnEnds (then the host fires for you), endsAt.
 *   - ?attract plays offline, bot against bot, both fleets shown (the preview video).
 *   - Leaderboard "wins": +1 for each match a player wins, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  size: 8,                    // squares per side of each grid
  fleet: [4, 3, 3, 2, 2],     // ship lengths; ship k is CONFIG.fleet[k] squares long
  shipNames: ["Battleship", "Cruiser", "Submarine", "Destroyer", "Patrol boat"],
  hitAgain: true,             // a hit lets you fire again
  placeMs: 45000,             // time to place your fleet (then it's sent as it stands)
  turnMs: 20000,              // time to fire before the host fires for you
  botMs: 1100,                // how long a bot aims before it fires
  botPlaceMs: 2500,           // how long a bot takes to place its fleet
  botFollowUp: 0.85,          // chance a bot chases a hit instead of firing somewhere new
  botNoise: 0.45,             // randomness in where a bot hunts (0 = sharp, 1 = wild)
  shellMs: 450,               // a shell's flight time before it lands
  resultsMs: 30000,           // the results show this long, then a new match starts
  seatGraceMs: 10000,         // a seated player silent this long hands the seat to a bot
  rejoinMs: 3000,             // a new host waits this long for players to re-send their fleets
  board: "wins",              // leaderboard name
  attractShots: 16,           // ?attract: shots already fired when a match starts
};
const BOT_NAMES = ["Admiral Ada", "Captain Rex", "Commodore Kit", "Skipper Sol"];
const COLORS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#b197fc", "#ff922b", "#f783ac", "#3bc9db"];
const NAME_A = ["Brave", "Salty", "Lucky", "Swift", "Jolly", "Clever"], NAME_B = ["Otter", "Gull", "Shark", "Walrus", "Puffin", "Seal"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'fleet-battle',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── SEALED FLEETS ───────────────────────────────────────────────────────────────────
// Everything in room state reaches every client, so a fleet is written SEALED: encrypted so only
// its one reader can open it. Each player publishes a public key in its own entity (`pk`); the
// host seals each fleet to that key and writes the box into shared state.
//   - The host answers every shot, so the host can read both fleets. Fine for friends, not cheat-proof.
//   - A new host can't open boxes the old host sealed, so every player re-sends its own fleet
//     to the new host (sealed, with mp.send), and the new host re-places the bots' fleets.
//   - crypto.subtle needs https or localhost. Without it seal()/open() pass the value through.
//   - NEVER plaintext online: with no key for the recipient (a player who just joined and hasn't
//     published `pk` yet, or one who left), seal() returns "" (an empty box nobody can open).
//     Only players whose `pk` the host has get a seat; bots have no key, so the host keeps
//     their fleets in its own memory.
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on) return "p:" + JSON.stringify(value);
    if (!toPub || !this.pair) return ""; // never plaintext: nobody can open an empty box
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);
      return JSON.parse(new TextDecoder().decode(pt));
    } catch { return null; }
  },
};

// ── SHIPS ───────────────────────────────────────────────────────────────────────────
// A square is a number: row * size + column. A ship is [square, dir]: its first square and
// 0 (runs right) or 1 (runs down). A fleet is one ship per entry of CONFIG.fleet, in that order.
const N = CONFIG.size;
const cellName = (c) => "ABCDEFGHIJKLMNOP"[c % N] + (Math.floor(c / N) + 1);
function shipCells([c, d], k) { const out = []; for (let j = 0; j < CONFIG.fleet[k]; j++) out.push(c + j * (d ? N : 1)); return out; }
function inBounds([c, d], k) { const r = Math.floor(c / N), col = c % N, len = CONFIG.fleet[k]; return c >= 0 && c < N * N && (d ? r + len <= N : col + len <= N); }
/** A fleet is valid when every ship is on the grid and no two ships share a square. */
function validFleet(f) {
  if (!Array.isArray(f) || f.length !== CONFIG.fleet.length) return false;
  const used = new Set();
  return f.every((s, k) => Array.isArray(s) && Number.isInteger(s[0]) && (s[1] === 0 || s[1] === 1) && inBounds(s, k) && shipCells(s, k).every((c) => !used.has(c) && used.add(c)));
}
/** Does this fleet agree with the shots fired at it (hits on ships, misses on water, the same ships sunk)? */
function fits(f, marks, sunk) {
  if (!validFleet(f)) return false;
  const on = new Set(f.flatMap(shipCells));
  for (let c = 0; c < N * N; c++) if ((marks[c] === "x") !== on.has(c) && marks[c] !== ".") return false;
  return sunk.every(([k, c, d]) => f[k][0] === c && f[k][1] === d);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/** Place a whole fleet at random. With `marks`/`sunk` it fits the shots already fired: every hit is
 *  covered, no ship sits on a miss, sunk ships stay put, and no afloat ship is already all hit. */
function placeFleet(marks = "", sunk = []) {
  const ships = CONFIG.fleet.map(() => null), used = new Set();
  for (const [k, c, d] of sunk) { ships[k] = [c, d]; shipCells(ships[k], k).forEach((x) => used.add(x)); }
  const need = []; for (let c = 0; c < N * N; c++) if (marks[c] === "x" && !used.has(c)) need.push(c);
  const todo = ships.map((s, k) => (s ? -1 : k)).filter((k) => k >= 0).sort((a, b) => CONFIG.fleet[b] - CONFIG.fleet[a]);
  let nodes = 0;
  function spots(k) {
    const out = [];
    for (let c = 0; c < N * N; c++) for (const d of [0, 1]) {
      const cells = inBounds([c, d], k) ? shipCells([c, d], k) : null;
      if (!cells || cells.some((x) => used.has(x) || marks[x] === "o") || cells.every((x) => marks[x] === "x")) continue;
      out.push({ s: [c, d], cover: cells.filter((x) => marks[x] === "x").length + Math.random() * 0.5 });
    }
    return shuffle(out).sort((a, b) => b.cover - a.cover).map((o) => o.s);
  }
  function go(n) {
    if (++nodes > 30000) return false;
    if (n === todo.length) return need.every((c) => used.has(c));
    const left = need.filter((c) => !used.has(c)).length, room = todo.slice(n).reduce((s, k) => s + CONFIG.fleet[k], 0);
    if (left > room) return false;
    const k = todo[n];
    for (const s of spots(k)) {
      const cells = shipCells(s, k);
      cells.forEach((x) => used.add(x)); ships[k] = s;
      if (go(n + 1)) return true;
      cells.forEach((x) => used.delete(x)); ships[k] = null;
    }
    return false;
  }
  return go(0) ? ships : null;
}
const randomFleet = () => placeFleet();

// ── BOT ─────────────────────────────────────────────────────────────────────────────
/** Where seat `s` fires next: next to a hit that hasn't sunk yet, else the square the most
 *  afloat ships could still cover (with some noise, so bots aren't perfect). */
function botAim(g, s) {
  const o = 1 - s, m = g.marks[o];
  const sunkCells = new Set(g.sunk[o].flatMap(([k, c, d]) => shipCells([c, d], k)));
  const at = (r, c) => (r >= 0 && r < N && c >= 0 && c < N ? m[r * N + c] : "");
  const open = []; for (let c = 0; c < N * N; c++) if (m[c] === "x" && !sunkCells.has(c)) open.push(c);
  if (open.length && Math.random() < CONFIG.botFollowUp) {
    const opts = [];
    for (const h of open) {
      const r = Math.floor(h / N), c = h % N;
      for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        if (at(r + dr, c + dc) !== ".") continue;
        const behind = at(r - dr, c - dc) === "x" && !sunkCells.has((r - dr) * N + c - dc); // continues a line of hits
        opts.push({ c: (r + dr) * N + c + dc, w: (behind ? 3 : 1) + Math.random() });
      }
    }
    if (opts.length) return opts.sort((a, b) => b.w - a.w)[0].c;
  }
  const heat = Array(N * N).fill(0);
  CONFIG.fleet.forEach((len, k) => {
    if (g.sunk[o].some((x) => x[0] === k)) return;
    for (let c = 0; c < N * N; c++) for (const d of [0, 1]) {
      if (!inBounds([c, d], k)) continue;
      const cells = shipCells([c, d], k);
      if (cells.some((x) => m[x] === "o" || sunkCells.has(x))) continue;
      for (const x of cells) if (m[x] === ".") heat[x]++;
    }
  });
  let best = -1, bestW = -1;
  for (let c = 0; c < N * N; c++) {
    if (m[c] !== ".") continue;
    const w = (heat[c] + 0.5) * (1 + CONFIG.botNoise * Math.random() * 3);
    if (w > bestW) { bestW = w; best = c; }
  }
  return best;
}

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
// The host's private memory: both fleets, the re-sent fleets after a handover, intents waiting.
const host = { last: null, ready: false, since: 0, busy: false, fleets: [], inbox: [], known: new Map() };
const gameMemo = { raw: undefined, g: null };
/** The game as state has it, or the host's own newer write that hasn't come back yet. */
function game() {
  if (gameMemo.raw !== S.shared.game) { gameMemo.raw = S.shared.game; gameMemo.g = parse(S.shared.game, null); }
  const g = gameMemo.g;
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const seatOf = (g, id) => (g ? g.seats.findIndex((s) => s.i === id) : -1);
const pkOf = (id) => (id === net.sessionId ? Seal.pub : S.entities.players[id]?.pk);
const canSit = (id) => net.offline || !Seal.on || !!pkOf(id);
const playerName = (id) => (id === net.sessionId ? myName : S.entities.players[id]?.n || "Player");
const playerColor = (id) => (id === net.sessionId ? myColor : S.entities.players[id]?.c || "#ccc");
const seatName = (s) => (s.b ? s.n : playerName(s.i));
const seatColor = (s) => (s.b ? s.c : playerColor(s.i));

/** Seal one human's fleet to them and write it to `fleet<i>`. Never writes a fleet in the clear online. */
async function sealFleet(g, i) {
  const s = g.seats[i], ships = host.fleets[i];
  if (!s || s.b || !ships) return;
  const box = await Seal.seal(pkOf(s.i), ships);
  if (box) net.setShared("fleet" + i, JSON.stringify({ id: s.i, r: g.id, by: Seal.pub, box })); // no key, no box: never in the clear
}
/** Write a result: the changed fleets first, then the game. */
async function commit(g, sealSeats = []) {
  if (!g) return null;
  for (const i of new Set(sealSeats)) await sealFleet(g, i);
  return writeGame(g);
}

/** A new match: players who were seated keep their seats, then waiting players, then bots. */
function newMatch(prev) {
  const humans = ATTRACT ? [] : livePlayers().filter(canSit);
  const keep = prev ? prev.seats.filter((s) => !s.b && humans.includes(s.i)).map((s) => s.i) : [];
  const ids = [...keep, ...humans.filter((id) => !keep.includes(id))].slice(0, 2);
  const used = new Set(ids.map(playerColor)), seats = ids.map((id) => ({ i: id, n: playerName(id), c: playerColor(id) }));
  for (let k = 0; seats.length < 2; k++) {
    const c = COLORS.find((x) => !used.has(x)) || COLORS[k]; used.add(c);

  net.on("myfleet", (d, from) => { // a player re-sending its fleet to me, the new host
    const g = game(), i = g && d ? seatOf(g, from) : -1;
    if (i < 0 || d.to !== net.sessionId || d.r !== g.id || host.ready) return;
    Seal.open(pkOf(from), d.box).then((ships) => { if (validFleet(ships)) host.known.set(i, ships); });
  });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || pickOne(COLORS);
  const pk = await Seal.init().catch(() => "");
  net.me.set({ n: myName, c: myColor, pk, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
